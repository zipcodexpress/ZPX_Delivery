name: Foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 docs/handoff/tests/validate_handoff.py
      - run: php -l apps/api/public/index.php
  local-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/dev.py init
      - run: python3 scripts/dev.py config
      - run: python3 scripts/dev.py up
      - run: python3 scripts/dev.py test-db
      - if: failure()
        run: python3 scripts/dev.py logs
      - if: always()
        run: python3 scripts/dev.py down
