<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ZipcodeXpress Management</title><link rel="stylesheet" href="/admin-style"></head>
<body class="login-page"><main class="login-card">
  <div class="login-brand">Zipcode<strong>Xpress</strong></div>
  <h1>Welcome back</h1><p class="intro">Sign in to the management console.</p>
  {if $error}<div class="alert" role="alert">{$error}</div>{/if}
  <form method="post" action="/admin/login">
    <input type="hidden" name="_csrf" value="{$csrf}">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
  </form>
</main></body></html>
