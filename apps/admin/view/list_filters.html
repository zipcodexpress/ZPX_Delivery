<section class="table-panel"><form method="get" action="/admin/{$page}" class="list-filter" role="search">
<label>Search<input type="search" name="q" value="{$data.filter.q}" maxlength="120" placeholder="Name, code, reference or ID"></label>
{if $page == 'box-models'}<label>Size<select name="size"><option value="">All sizes</option><option value="SMALL" {if $data.filter.size == 'SMALL'}selected{/if}>Small</option><option value="MEDIUM" {if $data.filter.size == 'MEDIUM'}selected{/if}>Mid</option><option value="LARGE" {if $data.filter.size == 'LARGE'}selected{/if}>Large</option><option value="XLARGE" {if $data.filter.size == 'XLARGE'}selected{/if}>X-large</option></select></label><label>Source<select name="source"><option value="">All sources</option><option value="LOCAL" {if $data.filter.source == 'LOCAL'}selected{/if}>Local</option><option value="HISTORICAL" {if $data.filter.source == 'HISTORICAL'}selected{/if}>Historical</option></select></label>{/if}
{if $page == 'body-box-layouts'}<label>Body model<select name="body"><option value="">All body models</option>{volist name="data.bodies" id="body"}<option value="{$body.id}" {if $data.filter.body == $body.id}selected{/if}>{$body.name}</option>{/volist}</select></label>{/if}
{if $page != 'box-models'}<label>Filter<select name="status"><option value="">All</option>
{if $page == 'body-models' || $page == 'body-box-layouts'}<option value="DRAFT" {if $data.filter.status == 'DRAFT'}selected{/if}>Local drafts</option><option value="READY" {if $data.filter.status == 'READY'}selected{/if}>Ready</option><option value="HISTORICAL" {if $data.filter.status == 'HISTORICAL'}selected{/if}>Historical</option>{/if}
{if $page == 'customers'}<option value="AVAILABLE" {if $data.filter.status == 'AVAILABLE'}selected{/if}>Shipping available</option><option value="RESTRICTED" {if $data.filter.status == 'RESTRICTED'}selected{/if}>Shipping restricted</option>{/if}
{if $page == 'drivers'}<option value="PENDING" {if $data.filter.status == 'PENDING'}selected{/if}>Pending</option><option value="ACTIVE" {if $data.filter.status == 'ACTIVE'}selected{/if}>Active</option><option value="SUSPENDED" {if $data.filter.status == 'SUSPENDED'}selected{/if}>Suspended</option><option value="INACTIVE" {if $data.filter.status == 'INACTIVE'}selected{/if}>Inactive</option>{/if}
{if $page == 'partners' || $page == 'sites'}<option value="DRAFT" {if $data.filter.status == 'DRAFT'}selected{/if}>Draft</option><option value="ACTIVE" {if $data.filter.status == 'ACTIVE'}selected{/if}>Active</option><option value="SUSPENDED" {if $data.filter.status == 'SUSPENDED'}selected{/if}>Suspended</option><option value="ARCHIVED" {if $data.filter.status == 'ARCHIVED'}selected{/if}>Archived</option>{/if}
{if $page == 'lockers'}<option value="ACTIVE" {if $data.filter.status == 'ACTIVE'}selected{/if}>Active</option><option value="INACTIVE" {if $data.filter.status == 'INACTIVE'}selected{/if}>Inactive</option>{/if}
{if $page == 'locker-setups'}<option value="DRAFT" {if $data.filter.status == 'DRAFT'}selected{/if}>Draft</option><option value="BOUND" {if $data.filter.status == 'BOUND'}selected{/if}>Bound</option><option value="REFERENCE" {if $data.filter.status == 'REFERENCE'}selected{/if}>Historical reference</option>{/if}
{if $page == 'pickup-routes'}<option value="ASSIGNED" {if $data.filter.status == 'ASSIGNED'}selected{/if}>Assigned</option><option value="UNASSIGNED" {if $data.filter.status == 'UNASSIGNED'}selected{/if}>Unassigned</option>{/if}
{if $page == 'pickup-recovery'}<option value="PUBLISHED" {if $data.filter.status == 'PUBLISHED'}selected{/if}>Published</option><option value="ACKNOWLEDGED" {if $data.filter.status == 'ACKNOWLEDGED'}selected{/if}>Acknowledged</option><option value="IN_PROGRESS" {if $data.filter.status == 'IN_PROGRESS'}selected{/if}>In progress</option>{/if}
{if $page == 'shipments'}<option value="DRAFT" {if $data.filter.status == 'DRAFT'}selected{/if}>Draft</option><option value="READY" {if $data.filter.status == 'READY'}selected{/if}>Ready</option><option value="CANCELLED" {if $data.filter.status == 'CANCELLED'}selected{/if}>Cancelled</option><option value="COMPLETED" {if $data.filter.status == 'COMPLETED'}selected{/if}>Completed</option>{/if}
</select></label>{/if}<button class="primary" type="submit">Search</button><a href="/admin/{$page}">Clear</a></form></section>
