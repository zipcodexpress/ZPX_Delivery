<section class="table-panel"><h2>Origin to hub routes</h2>{empty name="data.origins"}<p class="empty">No origin locations are available.</p>{else /}<div class="table-scroll"><table><thead><tr><th>Origin</th><th>Current hub</th><th>Assignment</th></tr></thead><tbody>{volist name="data.origins" id="row"}<tr><td><strong>{$row.name}</strong><small>{$row.code} · {$row.status}</small></td><td>{$row.hub_name|default='Unassigned'}</td><td><form method="post" action="/admin/action/route-assign" class="inline-form"><input type="hidden" name="_csrf" value="{$csrf}"><input type="hidden" name="idempotency_key" value="{$row.form_key}"><input type="hidden" name="id" value="{$row.origin_location_id}"><input type="hidden" name="version" value="{$row.version}"><label class="sr-only" for="hub-{$row.origin_location_id}">Hub</label><select id="hub-{$row.origin_location_id}" name="hub_id" required><option value="">Select hub</option>{volist name="data.hubs" id="hub"}<option value="{$hub.hub_id}" {if $hub.hub_id == $row.hub_id}selected{/if}>{$hub.name}</option>{/volist}</select><label class="sr-only" for="lat-{$row.origin_location_id}">Latitude</label><input id="lat-{$row.origin_location_id}" name="latitude" placeholder="Latitude" value="{$row.latitude|default=''}"><label class="sr-only" for="lng-{$row.origin_location_id}">Longitude</label><input id="lng-{$row.origin_location_id}" name="longitude" placeholder="Longitude" value="{$row.longitude|default=''}"><button type="submit">Save</button></form></td></tr>{/volist}</tbody></table></div>{/empty}</section>
