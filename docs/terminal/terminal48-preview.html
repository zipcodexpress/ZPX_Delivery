<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZPX Terminal48 — workflow design preview</title>
<style>
:root{--ink:#14243b;--muted:#516178;--blue:#1858c8;--canvas:#f3f6fa;--line:#d9e1ec;--green:#17633f;--amber:#855000;--red:#a52332}
*{box-sizing:border-box}body{margin:0;background:#e3e9f1;color:var(--ink);font:18px "Segoe UI",Arial,sans-serif}button,select,input{font:inherit}button{cursor:pointer;min-height:56px;border-radius:8px;border:1px solid var(--line);background:white;color:var(--ink);padding:12px 20px;font-weight:600}button:hover{background:#edf3fc}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a34e00;outline-offset:3px}button:disabled{cursor:not-allowed;background:#eef1f5;color:#66748a}button.primary{background:var(--blue);border-color:var(--blue);color:white}button.primary:hover{background:#1247a4}button.danger{color:var(--red)}
.review{max-width:1280px;margin:16px auto;padding:0 16px;font-size:14px}.reviewbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review strong{font-size:16px}.review select{min-height:40px;border:1px solid #a9b6c9;border-radius:6px;padding:6px;background:white;max-width:260px}.review button{font-size:14px;min-height:40px;padding:8px 12px}.review p{margin:10px 0;color:#384a64}.kiosk{width:min(1024px,100%);min-height:768px;display:flex;flex-direction:column;margin:12px auto 24px;background:var(--canvas);box-shadow:0 12px 40px #14243b22;border:1px solid #b9c5d7}.kiosk.compact{width:min(800px,100%);min-height:600px}.kiosk.wide{width:min(1280px,100%);min-height:800px}
header{height:72px;flex-shrink:0;background:white;padding:16px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}.brand{font-weight:800;font-size:26px;letter-spacing:-1px;color:var(--blue)}.brand span{font-weight:400;color:var(--ink);font-size:20px;letter-spacing:0}.site{margin-left:auto;text-align:right;font-size:16px}.site small{color:var(--muted);display:block;margin-top:4px;font-size:14px}.status{border-radius:100px;background:#e8f5ed;color:var(--green);padding:6px 12px;font-size:14px;font-weight:600}.status.warning{background:#fff3d8;color:var(--amber)}
main{padding:28px;flex:1;display:flex;flex-direction:column;gap:20px}.eyebrow{color:var(--blue);font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase}h1{font-size:36px;line-height:1.15;margin:4px 0 8px;letter-spacing:-.6px}h2{font-size:24px;margin:0 0 8px}p{line-height:1.45;margin:0;color:var(--muted)}.intro p{font-size:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1}.task{text-align:left;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:24px;border-radius:12px;background:white}.task strong{font-size:26px;line-height:1.2}.task small{font-size:17px;font-weight:400;line-height:1.4;color:var(--muted)}.icon{width:56px;height:56px;display:grid;place-items:center;color:var(--blue);background:#edf3fc;border-radius:12px}.icon svg{width:32px;height:32px}.tag{font-size:12px;color:var(--amber);border:1px solid #ecd2a0;background:#fff3d8;border-radius:4px;padding:4px 6px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1}.half{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.steps{display:flex;gap:16px;margin-top:20px;flex-direction:column}.step{display:flex;gap:12px;align-items:flex-start;font-size:18px}.step b{width:28px;height:28px;background:#edf3fc;color:var(--blue);border-radius:50%;display:grid;place-items:center;flex-shrink:0}.qr{width:220px;height:220px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;text-align:center;border:8px solid white;outline:1px solid var(--line);background:repeating-linear-gradient(45deg,#e3e9f1 0 12px,white 12px 24px);color:#14243b;font-size:18px;font-weight:700}.qr span{padding:16px;background:white;border:2px solid #14243b}.center{text-align:center}.subtle{font-size:14px;color:var(--muted)}.notice{padding:16px;border-radius:8px;background:#fff3d8;border:1px solid #ecd2a0;color:var(--amber);font-size:16px;line-height:1.4}.notice.info{background:#edf3fc;border-color:#c4d7f5;color:#244c85}.notice.error{background:#fff0f1;color:var(--red);border-color:#f0c6ce}.notice.success{background:#e8f5ed;color:var(--green);border-color:#bbdcc9}.row{display:flex;align-items:center;gap:12px}.row.between{justify-content:space-between}.facts{margin:0}.facts div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.facts div:last-child{border:0}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600;text-align:right}.badge{background:#edf3fc;color:var(--blue);font-size:14px;padding:6px 10px;border-radius:6px}.parcels{display:flex;flex-direction:column;gap:12px}.parcel{width:100%;display:flex;justify-content:space-between;text-align:left;gap:20px;align-items:center;padding:18px}.parcel small{display:block;font-weight:400;margin-top:6px;color:var(--muted)}input{width:100%;min-height:64px;font-size:22px;padding:14px;border:2px solid #899bb5;border-radius:8px;margin:12px 0}label{font-weight:600}.door-title{font-size:52px;font-weight:700;color:var(--blue);margin-bottom:6px}.locker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:280px;margin:16px auto}.door{height:46px;border:2px solid #acbacd;border-radius:3px;color:#61738a;display:grid;place-items:center;font-size:14px;background:#f3f6fa}.door.selected{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}.door.open{border-style:dashed;background:#edf3fc;color:var(--blue)}.progress{display:flex;gap:8px;align-items:center;padding-top:16px;font-size:14px;color:var(--muted)}.progress span{width:10px;height:10px;border-radius:50%;background:#aab8cc}.progress span.done{background:var(--green)}.large-mark{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;background:#e8f5ed;color:var(--green);font-size:40px;margin:0 auto 16px}
footer{border-top:1px solid var(--line);background:white;padding:12px 28px;display:flex;gap:12px;align-items:center;min-height:80px}.footer-note{font-size:14px;color:var(--muted);margin-left:auto}.footer-actions{margin-left:auto;display:flex;gap:12px}.compact header{height:64px;padding:12px 24px}.compact main{padding:20px 24px;gap:16px}.compact h1{font-size:30px}.compact h2{font-size:22px}.compact .intro p{font-size:18px}.compact .task{padding:20px;gap:10px}.compact .task strong{font-size:24px}.compact .task small{font-size:16px}.compact .panel{padding:18px}.compact footer{padding:8px 24px;min-height:72px}.compact .qr{width:190px;height:190px}.compact .steps{gap:12px;margin-top:12px}.compact .step{font-size:16px}.compact .facts div{padding:8px 0}.compact .door-title{font-size:44px}.compact .locker{margin:8px auto}.compact .door{height:36px}
.compact main{gap:12px}.compact .panel p{font-size:16px;line-height:1.35}.compact .notice{padding:12px;font-size:14px;line-height:1.35}.compact .steps{gap:8px}.compact .facts{font-size:16px}.compact .qr{width:180px;height:180px}.compact .parcel{padding:14px;font-size:16px}.compact .large-mark{width:56px;height:56px;margin-bottom:12px;font-size:32px}.compact .footer-note{max-width:175px;font-size:12px}
@media(max-width:700px){.columns,.half{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.task{min-height:140px}.site{font-size:14px}.status{display:none}header,footer{padding:12px 16px}main{padding:20px 16px}.footer-note{display:none}.kiosk,.kiosk.compact{min-height:600px}.brand span{display:none}h1{font-size:30px}footer{flex-wrap:wrap}}
@media(prefers-reduced-motion:no-preference){main{animation:appear .12s ease-out}@keyframes appear{from{opacity:.6}to{opacity:1}}}
</style>
</head>
<body>
<section class="review" aria-label="Design review controls">
 <div class="reviewbar"><strong>Terminal48 · design preview</strong><label for="screen" class="subtle">Screen</label><select id="screen" aria-label="Preview screen"></select><label for="size" class="subtle">Layout</label><select id="size"><option value="compact">800 × 600</option><option value="normal" selected>1024 × 768</option><option value="wide">1280 × 800</option></select><button id="offline">Connection example</button><button id="unknown">Unknown door example</button></div>
 <p>Offline, synthetic design only. Buttons simulate UI transitions; no network, payments, custody or locker hardware. QR is deliberately not scannable.</p>
</section>
<div class="kiosk" id="kiosk">
 <header><div class="brand">ZPX <span>Locker</span></div><div class="site">Austin North · Example site<small>Check the locker name on your phone</small></div><span id="status" class="status">Design preview</span></header>
 <main id="content" aria-live="polite"></main>
 <footer id="footer"></footer>
</div>
<script>
'use strict';
const screens={home:'H01 · Welcome',driver:'D01 · Driver services',prepare:'S01 · Prepare to send',pair:'P01 · Phone pairing',parcels:'D02 · Assigned parcels',scan:'S02 / R01 · Scan',review:'S03 / D03 · Review parcel',upgrade:'S04 · Size adjustment',opening:'L01 · Opening',door:'L02 · Place or remove',confirm:'L03 · Phone confirmation',complete:'L04 · Recorded',offline:'E01 · Connection interrupted',unknown:'E02 · Needs assistance',help:'Help',staff:'A01 · Staff diagnostics',legacy:'Apartment services'};
let current='home',flow='delivery',senderSize='SMALL',parcelSI='ZPX-DEMO-4821';
const content=document.getElementById('content'),footer=document.getElementById('footer'),picker=document.getElementById('screen');
Object.entries(screens).forEach(([key,title])=>{const option=document.createElement('option');option.value=key;option.textContent=title;picker.appendChild(option)});
const icons={pickup:'<path d="M4 12h24v16H4zM8 4h16v8M10 20h12M16 16v8"/>',send:'<path d="M4 10h24v18H4zM4 10l12-6 12 6M16 10v18M22 18h8m-4-4 4 4-4 4"/>',driver:'<path d="M3 7h18v16H3zM21 13h6l4 5v5H21M7 27a3 3 0 1 0 0-6 3 3 0 0 0 0 6M25 27a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>'};
function icon(kind){return '<span class="icon"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'+icons[kind]+'</svg></span>'}
function button(text,to,primary=false){return '<button '+(primary?'class="primary" ':'')+'data-screen="'+to+'">'+text+'</button>'}
function intro(title,detail,eyebrow=''){return '<div class="intro">'+(eyebrow?'<div class="eyebrow">'+eyebrow+'</div>':'')+'<h1>'+title+'</h1><p>'+detail+'</p></div>'}
function notice(text,kind=''){return '<div class="notice '+kind+'">'+text+'</div>'}
function planned(){return notice('Preview of a planned workflow. Real terminal authorization for this action is not yet available.')}
function nav(back,action){footer.innerHTML=(back?button('Back',back):button('Help','help'))+'<span class="footer-note">Synthetic example · no live transaction</span><div class="footer-actions">'+(action||button('Home','home'))+'</div>'}
function diagram(open=false){return '<div class="locker" aria-label="Illustrative cabinet, compartment B04 highlighted">'+Array.from({length:12},(_,i)=>'<div class="door '+(i===7?'selected '+(open?'open':''):'')+'">'+(i===7?'B04':String(i+1).padStart(2,'0'))+'</div>').join('')+'</div><p class="subtle center">Illustrative layout · use verified body positions in production</p>'}
function label(){return flow==='recipient'?'Delivery pickup credential':'Primary shipping label'}
function removal(){return flow==='pickup'||flow==='recipient'}
function flowTitle(){return {delivery:'Driver delivery',pickup:'Driver pickup',send:'Send a package',recipient:'Collect a package'}[flow]}
function details(){return '<dl class="facts"><div><dt>Shipping identifier</dt><dd>'+parcelSI+'</dd></div><div><dt>'+ (flow==='send'?'Origin':'This stop')+'</dt><dd>Austin North</dd></div><div><dt>Destination</dt><dd>'+ (flow==='send'||flow==='pickup'?'Round Rock Central':'Austin North')+'</dd></div><div><dt>Package size</dt><dd>'+ (flow==='send'?senderSize:parcelSI==='ZPX-DEMO-4822'?'SMALL':'MEDIUM')+'</dd></div><div><dt>Compartment</dt><dd>B04 · illustrated</dd></div></dl>'}
function show(screen){
 current=screen;picker.value=screen;document.getElementById('status').className='status'+(['offline','unknown'].includes(screen)?' warning':'');document.getElementById('status').textContent=['offline','unknown'].includes(screen)?'Needs attention':'Design preview';
 let html='';
 switch(screen){
 case 'home':html=intro('What would you like to do?','Choose a service to get started.','Welcome')+'<div class="cards"><button class="task" data-flow="recipient" data-screen="scan">'+icon('pickup')+'<strong>Pick up</strong><small>Collect a package with your pickup credential.</small><span class="tag">Delivery flow planned</span></button><button class="task" data-flow="send" data-screen="prepare">'+icon('send')+'<strong>Send a package</strong><small>Deposit a shipment prepared on your phone.</small><span class="tag">Origin flow planned</span></button><button class="task" data-screen="driver">'+icon('driver')+'<strong>Driver services</strong><small>Pick up assigned parcels or deliver to this locker.</small><span class="badge">Phone-assisted</span></button></div>';nav(null,button('Apartment services','legacy'));break;
 case 'driver':html=intro('Driver services','Choose the task for your assigned stop.','Driver')+'<div class="columns"><button class="task" data-flow="pickup" data-screen="pair">'+icon('pickup')+'<strong>Pick up parcels</strong><small>Collect assigned parcels from this origin locker.</small><span class="tag">Door authorization planned</span></button><button class="task" data-flow="delivery" data-screen="pair">'+icon('driver')+'<strong>Deliver parcels</strong><small>Deposit one parcel at a time at this destination.</small><span class="badge">Final-deposit APIs exist</span></button></div>';nav('home');break;
 case 'prepare':html=intro('Have your shipping label ready','Create and pay for your shipment on your phone.','Send a package')+'<div class="columns"><section class="panel"><h2>Already have a label?</h2><p>Attach the active label to your package. Check that Austin North is the selected origin.</p><div class="steps"><div class="step"><b>1</b><span>Pair your phone with this locker.</span></div><div class="step"><b>2</b><span>Scan your label and check the package size.</span></div><div class="step"><b>3</b><span>Deposit, close the door and confirm on your phone.</span></div></div></section><section class="panel"><h2>Sending something new?</h2><p>Use the ZPX customer app to choose the recipient, destination, size and payment. You will need a usable label before deposit.</p></section></div>'+planned();nav('home',button('Preview phone pairing','pair',true));break;
 case 'pair':html=intro('Approve this locker on your phone','Open the ZPX app and scan the locker pairing QR.',flowTitle())+'<div class="columns"><section class="panel center"><div class="qr" role="img" aria-label="QR placeholder, not scannable"><span>PAIRING QR<br>Design placeholder</span></div><strong>Austin North</strong><p class="subtle">Expiry will come from the server</p></section><section class="panel"><h2>'+flowTitle()+'</h2><div class="steps"><div class="step"><b>1</b><span>Sign in on your phone.</span></div><div class="step"><b>2</b><span>Check the locker name and requested action.</span></div><div class="step"><b>3</b><span>Approve on your phone, then follow the screen.</span></div></div></section></div>';nav(flow==='send'?'prepare':'driver',button('Simulate phone approval',flow==='send'?'scan':'parcels',true));break;
 case 'parcels':html=intro(removal()?'Parcels to pick up':'Parcels to deliver','Handle one assigned parcel at a time.',flowTitle())+'<div class="row between"><strong>Austin North · Example stop</strong><span class="badge">0 of 2 recorded · synthetic</span></div><div class="parcels"><button class="parcel" data-screen="review" data-parcel="ZPX-DEMO-4821"><span>ZPX-DEMO-4821<small>MEDIUM · '+(removal()?'Remove from origin':'Destination: Austin North')+'</small></span><span class="badge">'+(removal()?'Preview pickup':'Preview delivery')+'</span></button><button class="parcel" data-screen="review" data-parcel="ZPX-DEMO-4822"><span>ZPX-DEMO-4822<small>SMALL · illustrative second parcel</small></span><span>View</span></button></div>'+notice('Production parcel details and counts require a signed own-session projection. These rows are synthetic.','info');nav('driver');break;
 case 'scan':html=intro(flow==='recipient'?'Scan your pickup credential':'Scan the package label',flow==='recipient'?'Use your Delivery pickup credential. A tracking number cannot open a door.':'Hold the active primary label in front of the scanner.',flowTitle())+'<section class="panel"><label for="scanvalue">'+label()+'</label><input id="scanvalue" autocomplete="off" spellcheck="false" placeholder="'+(flow==='recipient'?'Credential or supported manual entry':'Scan label or enter supported label text')+'"><p class="subtle">Preview accepts only DEMO. Do not enter a real credential.</p><div id="scanerror" role="alert"></div></section>'+planned();nav('home','<button class="primary" id="validate">Validate demo input</button>');break;
 case 'review':html=intro(removal()?'Review your collection':'Review this package','Check the details before the authorized compartment opens.',flowTitle())+'<div class="half"><section class="panel">'+details()+'</section><section class="panel"><h2>'+ (removal()?'One parcel at a time':'Check the package size')+'</h2><p>'+ (removal()?'Remove only the selected parcel. Driver pickup requires its label scan on the phone.':'The server chooses a compatible compartment. Larger compartments need an approved size adjustment for sending.')+'</p><div class="steps">'+(flow==='send'?button('My package needs more space','upgrade'):notice('Driver approval and preparation happen on the phone.','info'))+'</div></section></div>';nav(flow==='send'||flow==='recipient'?'scan':'parcels',button('Simulate authorized opening','opening',true));break;
 case 'upgrade':html=intro('Need a larger compartment?','Keep the package with you until the adjustment is approved.','Send a package')+'<div class="columns"><section class="panel"><h2>Paid size: '+senderSize+'</h2><p>Choose another compatible compartment of the paid size, or request an upgrade on your phone.</p><div class="steps">'+button('Preview same-size retry','review')+'</div></section><section class="panel"><h2>'+ (senderSize==='LARGE'?'Maximum size reached':'Upgrade to '+(senderSize==='SMALL'?'MEDIUM':'LARGE'))+'</h2><p>'+ (senderSize==='LARGE'?'If the parcel does not fit, keep it with you and use another delivery method.':'The server must quote the price difference and confirm payment before a larger compartment is reserved.')+'</p><div class="steps"><span class="badge">'+ (senderSize==='LARGE'?'No larger Phase 1 size':'Waiting for quote and phone payment')+'</span></div></section></div>'+notice('If a door was already opened, remove the parcel and close it first. The prior claim needs server reconciliation. No automatic reopen.');nav('review',senderSize==='LARGE'?button('Help','help'):'<button class="primary" data-screen="review" data-upgrade="true">Simulate approved adjustment</button>');break;
 case 'opening':html=intro('Opening your compartment','Please wait. A command being sent does not prove the door opened.',flowTitle())+'<div class="columns"><section class="panel center"><div class="door-title">B04</div>'+diagram()+'</section><section class="panel"><h2>Checking the door</h2><p>Authorized intent is saved before sending. The terminal waits for a fresh observation of this exact compartment.</p><div class="progress"><span class="done"></span>Intent saved <span></span>Door observation</div></section></div>';nav(null,button('Simulate observed open','door',true));break;
 case 'door':html=intro(removal()?'Remove the package and close the door':'Place the package and close the door','Use the highlighted compartment. Keep your phone nearby.',flowTitle())+'<div class="columns"><section class="panel center"><div class="door-title">B04</div>'+diagram(true)+'</section><section class="panel"><h2>'+ (removal()?'Check the parcel':'Place only this package')+'</h2><p>'+ (flow==='pickup'?'Scan the removed parcel label on your phone. A different parcel must not be marked collected.':flow==='recipient'?'Take your package, then close the door. A package-label scan is not required for recipient collection.':'Check the SI on the label, place it inside, then close the door.')+'</p><div class="steps">'+notice('The terminal observes door closure. Closure alone does not prove the package was placed or removed.','info')+'</div></section></div>';nav(null,button('Simulate observed close','confirm',true));break;
 case 'confirm':html=intro('Confirm on your phone','The door is closed. The parcel action still needs confirmation.',flowTitle())+'<section class="panel center"><div class="large-mark">✓</div><h2>Door closure observed</h2><p>'+ (removal()?'Confirm that you removed the correct package.':'Confirm that you placed this package in the compartment.')+'</p><p class="subtle" style="margin-top:16px">Waiting for actor attestation and server confirmation</p></section>'+notice('No custody success is shown until the backend confirms the session. An empty command list is not confirmation.','info');nav(null,button('Simulate server confirmation','complete',true));break;
 case 'complete':html=intro(flow==='send'?'Package deposited':removal()?'Collection recorded':'Delivery recorded','This screen requires an authoritative server-confirmed result.',flowTitle())+'<section class="panel center"><div class="large-mark">✓</div><h2>'+parcelSI+'</h2><p>'+ (flow==='send'?'The package is at the origin locker.':flow==='recipient'?'The one-time collection is recorded.':flow==='pickup'?'The package is now recorded with the inbound driver.':'The package is at the destination locker.')+'</p><p class="subtle" style="margin-top:16px">Synthetic success example · no shipment changed</p></section>';nav(null,(flow==='delivery'||flow==='pickup'?button('Next parcel example','parcels'): '')+button('Done','home',true));break;
 case 'offline':html=intro('Connection interrupted','The next action depends on whether a command was already sent.','Recovery example')+'<div class="columns"><section class="panel"><h2>Before a door command</h2><p>Stop here and keep the parcel with you. A new transaction needs online authorization.</p></section><section class="panel"><h2>After a door command</h2><p>Close the door. Keep the saved session and evidence while the terminal retries synchronization.</p></section></div>'+notice('Do not retry the physical open. The transaction must not be labelled successful while server confirmation is pending.');nav(null,button('Help','help')+button('Back to preview home','home',true));break;
 case 'unknown':html=intro('This compartment needs assistance','We could not confirm what happened to the door.','Recovery example')+'<section class="panel"><h2>Do not start another parcel here</h2><p>Keep the parcel with you if you have it. If a door is open, close it. Use the support reference for this session.</p><div class="steps"><strong>Reference: DEMO-SESSION-0042</strong><p class="subtle">The retained command and claim require reconciliation.</p></div></section>'+notice('No automatic reopen, release, or custody change. A staff decision cannot invent an open/close observation.','error');nav(null,button('Help','help',true));break;
 case 'help':html=intro('Help with this locker','Use the site support instructions or contact the configured support team.','Help')+'<section class="panel"><h2>What to have ready</h2><div class="steps"><div class="step"><b>1</b><span>Locker: Austin North (example).</span></div><div class="step"><b>2</b><span>Non-secret operation reference, if shown.</span></div><div class="step"><b>3</b><span>Whether the door is open and who has the parcel.</span></div></div></section>'+notice('No support number is invented in this preview. Production uses the verified site contact.','info');nav('home',button('Staff diagnostics preview','staff'));break;
 case 'staff':html=intro('Staff diagnostics','Production staff access requires authentication.','Diagnostic design')+'<section class="panel"><dl class="facts"><div><dt>Hardware mode</dt><dd>Design only · no controller</dd></div><div><dt>Framework target</dt><dd>.NET Framework 4.8</dd></div><div><dt>Configuration / ownership</dt><dd>Not loaded</dd></div><div><dt>Journal / pending evidence</dt><dd>Not connected</dd></div><div><dt>Driver/customer identity</dt><dd>Phone-owned</dd></div></dl></section>'+notice('Read-only layout. No maintenance door-open control, credential or real hardware address is exposed.','info');nav('help');break;
 case 'legacy':html=intro('Apartment services','Continue with the established resident or carrier workflow.','Compatibility')+'<section class="panel"><h2>Existing Terminal452 screens</h2><p>Resident pickup, carrier deposit, manual dropoff and configured service-type functions stay in the legacy adapter with their existing TP8 API.</p><div class="steps">'+notice('This preview does not launch the existing terminal or contact TP8.','info')+'</div></section>';nav('home');break;
 }
 content.innerHTML=html;
}
document.addEventListener('click',event=>{const action=event.target.closest('[data-screen]');if(action){if(action.dataset.flow){flow=action.dataset.flow;senderSize='SMALL';parcelSI='ZPX-DEMO-4821'}if(action.dataset.parcel)parcelSI=action.dataset.parcel;if(action.dataset.upgrade)senderSize=senderSize==='SMALL'?'MEDIUM':'LARGE';show(action.dataset.screen)}});
document.addEventListener('click',event=>{if(event.target.id==='validate'){const input=document.getElementById('scanvalue');if(input.value.trim()!=='DEMO'){document.getElementById('scanerror').innerHTML=notice('Use DEMO to test this screen. Real credentials are not accepted.','error');input.setAttribute('aria-invalid','true');input.focus()}else show('review')}});
document.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.id==='scanvalue'){event.preventDefault();document.getElementById('validate').click()}});
picker.addEventListener('change',()=>show(picker.value));
document.getElementById('size').addEventListener('change',event=>{document.getElementById('kiosk').className='kiosk '+(event.target.value==='normal'?'':event.target.value)});
document.getElementById('offline').addEventListener('click',()=>show('offline'));
document.getElementById('unknown').addEventListener('click',()=>show('unknown'));
show('home');
</script>
</body>
