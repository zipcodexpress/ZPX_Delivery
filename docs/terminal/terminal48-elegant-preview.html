rder-radius:12px;padding:17px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}.inspector .eyebrow{margin:0;letter-spacing:1.4px;font-size:10px}.door-number{font:400 40px/1 Georgia,serif;margin:0}.inspector label{font-size:11px;color:var(--muted)}.inspector select{min-height:44px;width:100%;border:1px solid #bdcdb9;border-radius:7px;background:#fff;padding:0 8px;color:var(--ink);font-size:13px}.facts{margin:0;font-size:12px}.facts div{display:flex;justify-content:space-between;gap:5px;border-top:1px solid #edf0e9;padding:8px 0}.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600}.inspector .actions{margin-top:auto;display:grid;gap:8px}.inspector .button{font-size:13px;padding:8px;min-height:46px}.micro{font-size:11px;line-height:1.45;color:var(--muted);margin:0}
.workflow-grid{display:grid;grid-template-columns:1fr 260px;gap:28px;flex:1;align-items:center}.steps{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:20px}.steps li{display:flex;align-items:flex-start;gap:13px;font-size:15px}.step-no{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-size:13px;flex:none}.steps small{display:block;font-size:13px;color:var(--muted);margin-top:3px}.pairing{padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px;text-align:center}.qr{margin:0 auto 12px;width:158px;height:158px;display:grid;place-items:center;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#f0f3eb,#f0f3eb 4px,white 4px,white 12px);border-radius:8px}.qr svg{width:56px;height:56px;background:white;padding:8px}.pairing strong{font-size:19px;letter-spacing:4px;display:block;margin:6px}.pairing small{font-size:12px;color:var(--muted)}.center-state{margin:auto;text-align:center;max-width:520px}.center-state .quiet-mark{margin:0 auto 18px;width:74px;height:74px}.center-state .title{font:400 37px/1.2 Georgia,serif}.center-state .lead{line-height:1.6}.center-state .button{margin-top:24px}.inline-actions{display:flex;justify-content:center;gap:12px;margin-top:20px}.inline-actions .button{margin:0}.route-options{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;max-height:255px}.route-options .task{min-height:180px}.health{display:grid;grid-template-columns:1fr 1fr;gap:14px}.health article{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.health h2{font-size:16px;font-weight:600;margin:0 0 7px}.health p{font-size:14px;color:var(--muted);margin:0}.health strong{font-size:19px;display:block;margin:10px 0;color:var(--green)}
.overlay{position:absolute;inset:0;background:#10291ed0;display:grid;place-items:center;z-index:4;padding:30px}.kiosk{position:relative}.dialog{width:420px;max-width:100%;padding:30px;background:var(--paper);border-radius:18px;box-shadow:0 12px 70px #0003}.dialog .title{font-size:27px}.dialog p{font-size:15px;line-height:1.6;color:var(--muted)}.dialog .inline-actions{justify-content:stretch}.dialog .button{flex:1}.kiosk.compact header{height:54px}.kiosk.compact footer{height:54px}.kiosk.compact main{padding:18px 24px;gap:14px}.kiosk.compact .home-title{font-size:34px}.kiosk.compact .eyebrow{margin-bottom:5px}.kiosk.compact .cards{min-height:196px;max-height:215px}.kiosk.compact .task{padding:17px}.kiosk.compact .task .icon{margin-bottom:13px;width:42px;height:42px}.kiosk.compact .task strong{font-size:20px}.kiosk.compact .task .description{font-size:13px;margin:7px 0 12px}.kiosk.compact .login{gap:36px;grid-template-columns:1fr 260px}.kiosk.compact .keypad button{height:44px}.kiosk.compact .keypad{gap:5px;margin:7px 0}.kiosk.compact .manager{gap:10px}.kiosk.compact .inspector{padding:12px;gap:8px}.kiosk.compact .facts div{padding:6px 0}.kiosk.compact .door-number{font-size:30px}.kiosk.compact .manager .title{font-size:24px}.kiosk.compact .manager .lead{font-size:13px;margin:5px 0 0}.kiosk.compact .tower-heading{margin-bottom:3px}.kiosk.compact .legend{margin-top:5px}.kiosk.compact .steps{gap:14px;margin-top:18px}.kiosk.compact .workflow-grid{gap:20px}.kiosk.compact .pairing{padding:17px}.kiosk.compact .center-state .title{font-size:33px}
.inspector{gap:8px;padding:14px}.inspector .eyebrow{letter-spacing:.6px;font-size:9px;white-space:nowrap}.door-number{font-size:34px}.facts div{padding:6px 0}.kiosk.compact .inspector{gap:6px;padding:10px}.kiosk.compact .inspector .door-number{display:none}.kiosk.compact .inspector .micro{font-size:10px}.kiosk.compact .inspector .eyebrow{margin:0}
.kiosk.compact .health article{padding:16px}

<body>
<section class="review" aria-label="Prototype controls">
 <h1>Terminal48 <span style="font-weight:400;color:#627465">/ Quiet confidence</span><small>Interactive UI design · 06 October 2026</small></h1>
 <label>Screen <select id="screen"><option value="home">Home</option><option value="login">Admin access</option><option value="manager">Locker manager</option><option value="pickup">Pick up</option><option value="send">Send a parcel</option><option value="driver">Driver services</option><option value="door">Door open</option><option value="confirm">Confirm deposit</option><option value="success">Complete</option><option value="recovery">Recovery</option><option value="help">Help & status</option></select></label>
 <label>Size <select id="size"><option value="800,600">800 × 600</option><option value="784,521">784 × 521</option></select></label>
 <label><input id="offline" type="checkbox"> Offline</label><button id="advance">Simulate next step →</button>
 <p class="note">DESIGN PREVIEW · Sample connection and parcel states. No network requests, authentication, database writes or physical door commands.</p>
</section>
<div class="stage"><div class="kiosk" id="kiosk" aria-label="Terminal UI preview"><header id="header"></header><main id="main"></main><footer id="footer"></footer></div></div>
<script>
'use strict';
const paths={box:'<path d="m3 7 9-4 9 4-9 4-9-4Zm0 0v10l9 4 9-4V7M12 11v10M7.5 5 16 9"/>',pickup:'<path d="M5 3h14v18H5zM8 6h8v12H8zM13 12h1M3 21h18"/>',send:'<path d="M3 10v10h17V10M3 10h17M8 14h7M12 3v8m-4-4 4-4 4 4"/>',driver:'<path d="M2 5h12v12H2zM14 9h4l4 5v3h-8M6 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm12 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/>',arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M10 5h4m-3 14h2"/>',home:'<path d="m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/>',check:'<path d="m5 12 4 4L19 6"/>',controller:'<rect x="4" y="3" width="16" height="12" rx="1"/><path d="M9 21h6M12 15v6M7 6h10"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 0c0 3-3 2-3 5m0 4h.01"/>'};
const icon=name=>`<svg aria-hidden="true" viewBox="0 0 24 24">${paths[name]||paths.box}</svg>`;
// Geometry from the real cabinet10191 projection. Displayed door = raw channel +1.
const outer=[[[1,40],[2,40],[3,40],[4,40],[5,40]],[[11,40],[12,80],[13,80]]];
const layouts=[outer,[[[1,40],[2,20],[3,20],[7,80,true],[8,20],[9,40],[10,50]],[[11,40],[12,20],[13,20],[14,20],[15,20],[16,20],[17,20],[18,20],[19,40],[20,50]]],outer];
let page='home',tower=2,door=9,code='',offline=false,flow='pickup',opened=new Set(),pending=false;
const main=document.querySelector('#main'),kiosk=document.querySelector('#kiosk');
const doors=t=>layouts[t-1].flat().filter(x=>!x[2]).map(x=>x[0]);
function go(next){page=next;code='';document.querySelector('#screen').value=next;render();}
function btn(label,action,secondary=false,disabled=false){return `<button class="button ${secondary?'secondary':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;}
function heading(title,subtitle,right=''){return `<div class="screen-heading"><div><h1 class="title">${title}</h1><p class="lead">${subtitle}</p></div>${right}</div>`;}
function task(title,description,name,action,primary=false){return `<button class="task ${primary?'primary':''}" data-action="${action}"><span class="icon">${icon(name)}</span><strong>${title}</strong><span class="description">${description}</span><span class="call">${title==='Driver services'?'Continue route':'Get started'} ${icon('arrow')}</span></button>`;}
function render(){
 document.querySelector('#header').innerHTML=`<div class="brand">ZPX <small>DELIVERY</small></div><div class="identity"><b>Cabinet 10191</b><span>ZIP 78730</span></div>${page!=='home'?`<span class="divider"></span><button class="header-home" data-action="home" ${pending?'disabled':''}>${icon('home')} Home</button>`:''}`;
 document.querySelector('#footer').innerHTML=`<span class="status ${offline?'off':''}"><i class="dot"></i> API ${offline?'offline':'connected'}</span><span class="divider"></span><span class="status ${offline?'off':''}"><i class="dot"></i> Controller ${offline?'unknown':'3 / 3'}</span><div class="footer-actions"><button class="text-button" data-action="help">Help & status</button>${page!=='manager'&&page!=='login'?`<button class="text-button" data-action="login" ${pending?'disabled':''}>Admin</button>`:''}</div>`;
 main.className=page==='manager'?'manager':'';
 if(page==='home')main.innerHTML=`<div class="intro"><div><p class="eyebrow">WELCOME TO YOUR LOCKER</p><h1 class="title home-title">Your day, delivered.</h1><p class="lead">Pick up a parcel, send one, or continue your route.</p></div><div class="quiet-mark">${icon('box')}</div></div><div class="cards">${task('Pick up','Your parcel is ready.<br>Let’s get it to you.','pickup','pickup',true)}${task('Send a parcel','Have your shipping label<br>and parcel ready.','send','send')}${task('Driver services','Pick up or deliver parcels<br>on your assigned route.','driver','driver')}</div><p class="home-hint">${icon('phone')} Keep your phone handy. We’ll guide you through each step.</p>`;
 else if(page==='login')main.innerHTML=`<div class="login"><div><div class="quiet-mark">${icon('lock')}</div><p class="eyebrow">LOCKER ADMINISTRATION</p><h1 class="title">Everything<br>under control.</h1><p class="lead">Enter your admin code to manage this locker.</p><p class="micro" style="margin-top:20px">Cabinet 10191 · Authorised access</p></div><form id="login-form"><label class="code-label" for="code">Admin code</label><input class="code" id="code" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-describedby="login-error" value="${code}"><div class="keypad">${['1','2','3','4','5','6','7','8','9','Delete','0','Clear'].map(x=>`<button type="button" class="${x.length>1?'word':''}" data-key="${x}">${x}</button>`).join('')}</div><button class="button full" type="submit" ${offline?'disabled':''}>Enter locker manager ${icon('arrow')}</button><p class="error" id="login-error" aria-live="polite">${offline?'Connect to the API to sign in.':''}</p></form></div>`;
 else if(page==='manager'){
  const selectedState=offline?'Unknown':opened.has(tower+':'+door)?'Open':'Closed';
  main.innerHTML=heading('Locker manager',pending?'Opening recorded. Close the selected doors when finished.':'Select a tower or a door to manage it.',`<button class="text-button" data-action="home" ${pending?'disabled':''}>Sign out ↗</button>`)+`<div class="manager-grid"><div class="diagram"><div class="towers">${layouts.map((cols,i)=>`<section class="tower ${tower===i+1?'selected':''}"><button class="tower-heading" data-tower="${i+1}" ${pending?'disabled':''}>Tower ${i+1}${i===1?' · Main':''}</button><div class="cabinet">${cols.map(col=>`<div class="column">${col.map(([n,h,controller])=>controller?`<div class="cell controller" style="flex-grow:${h}" aria-label="Controller, display only">${icon('controller')}<span>Controller</span></div>`:`<button class="cell ${tower===i+1&&door===n?'selected':''} ${opened.has((i+1)+':'+n)?'open':''} ${offline?'unknown':''}" style="flex-grow:${h}" data-door="${i+1},${n}" aria-label="Tower ${i+1}, door ${n}, ${offline?'unknown':opened.has((i+1)+':'+n)?'open':'closed'}" ${pending?'disabled':''}>${n}${opened.has((i+1)+':'+n)?' ↗':''}</button>`).join('')}</div>`).join('')}</div></section>`).join('')}</div><div class="legend"><span><i class="swatch"></i>Closed</span><span><i class="swatch open"></i>Open</span><span><i class="swatch unknown"></i>Unknown</span><span>Sensor status · not parcel occupancy</span></div></div><aside class="inspector"><p class="eyebrow">TOWER ${tower} · SELECTED DOOR</p><h2 class="door-number">${String(door).padStart(2,'0')}</h2><label for="door-choice">Choose a door</label><select id="door-choice" ${pending?'disabled':''}>${doors(tower).map(d=>`<option value="${d}" ${d===door?'selected':''}>Door ${d}</option>`).join('')}</select><dl class="facts"><div><dt>Door</dt><dd>${selectedState}</dd></div><div><dt>Parcel space</dt><dd>${offline?'Unknown':'Available'}</dd></div></dl><div class="actions">${btn('Open door','open-door',false,offline||pending)}${btn('Open tower ('+doors(tower).length+')','open-tower',true,offline||pending)}</div><p class="micro">${pending?'Waiting for fresh closed-door readings.':'Opening a door does not complete a pickup.'}</p></aside></div>`;
 }
 else if(['pickup','send','delivery','collection'].includes(page)){
  flow=page;const pick=page==='pickup';const title=pick?'Let’s collect your parcel.':page==='send'?'Ready to send?':page==='delivery'?'Deliver at this locker.':'Collect your assigned parcels.';
  main.innerHTML=`<div class="workflow-grid"><div><p class="eyebrow">${pick?'PICK UP':page==='send'?'SEND A PARCEL':'DRIVER SERVICES'} · STEP 1 OF 3</p><h1 class="title" style="font:400 35px/1.16 Georgia,serif">${title}</h1><p class="lead">Continue securely with your phone.</p><ol class="steps"><li><span class="step-no">1</span><div>Open the ${['delivery','collection'].includes(page)?'driver':'ZPX'} app<small>Choose “Use locker” on your phone.</small></div></li><li><span class="step-no">2</span><div>Scan the code on this screen<small>Confirm cabinet 10191 in the app.</small></div></li><li><span class="step-no">3</span><div>${pick?'Choose your parcel':'Scan the parcel label'}<small>We’ll open the correct door for you.</small></div></li></ol>${offline?'<p class="notice">Connection lost. Your parcel has not moved. Please try again when connected.</p>':''}</div><div class="pairing"><div class="qr">${icon('phone')}</div><small>QR design placeholder</small><p style="margin:14px 0 2px;font-size:13px">Or enter this code in the app</p><strong>438 291</strong><small>${offline?'Waiting for connection':'Waiting for your phone…'}</small></div></div>`;
 }
 else if(page==='driver')main.innerHTML=heading('A smooth stop on your route.','Choose the task assigned to you in the driver app.')+`<div class="route-options">${task('Collect parcels','Pick up parcels that are ready<br>for the next part of their journey.','pickup','collection',true)}${task('Deliver parcels','Place arriving parcels into<br>their assigned compartments.','driver','delivery')}</div><p class="home-hint">${icon('phone')} Your driver app verifies your route and this locker stop.</p>`;
 else if(page==='door')main.innerHTML=`<div class="center-state"><div class="quiet-mark">${icon('pickup')}</div><p class="eyebrow">TOWER 2 · DOOR 9</p><h1 class="title">Your door is open.</h1><p class="lead">${flow==='pickup'||flow==='collection'?'Collect your parcel, then close the door.':'Place your parcel inside, then close the door.'}</p><p class="notice good" style="margin-top:25px">Waiting for the door to close…</p></div>`;
 else if(page==='confirm')main.innerHTML=`<div class="center-state"><div class="quiet-mark">${icon('check')}</div><p class="eyebrow">DOOR CLOSED</p><h1 class="title">${flow==='pickup'||flow==='collection'?'Have you collected your parcel?':'Is your parcel inside?'}</h1><p class="lead">Confirm to finish this step.</p><div class="inline-actions">${btn('Not yet','decline',true)}${btn('Yes, confirm','success',false,offline)}</div></div>`;
 else if(page==='success')main.innerHTML=`<div class="center-state"><div class="quiet-mark">${icon('check')}</div><p class="eyebrow">ALL DONE</p><h1 class="title">You’re on your way.</h1><p class="lead">${flow==='pickup'||flow==='collection'?'Your collection is confirmed.':'Your parcel is safely deposited.'}<br>You’ll find the details in your app.</p>${btn('Back to Home','home')}</div>`;
 else if(page==='recovery')main.innerHTML=`<div class="center-state"><div class="quiet-mark">${icon('help')}</div><p class="eyebrow">ACTION NEEDED</p><h1 class="title">Let’s check the door.</h1><p class="lead">The previous opening needs verification.<br>Close the selected doors before continuing.</p><p class="notice">An admin can check the door sensors and resume.<br>The terminal will not repeat the opening.</p>${btn('Admin access','login',false,offline)}</div>`;
 else if(page==='help')main.innerHTML=heading('Here to help.','Connection information for this locker.')+`<div class="health"><article><h2>Cabinet</h2><strong>10191</strong><p>ZIP 78730 · 3 towers</p></article><article><h2>API connection</h2><strong>${offline?'Offline':'Connected'}</strong><p>${offline?'Check the network connection.':'Ready to receive your next task.'}</p></article><article><h2>Controller connection</h2><strong>${offline?'Status unknown':'3 of 3 boards'}</strong><p>${offline?'Door actions are unavailable.':'All configured boards are responding.'}</p></article><article><h2>Need assistance?</h2><strong style="font-size:16px">Contact the site team</strong><p>Share cabinet number 10191.</p></article></div><p class="micro">Door sensors report open or closed. Parcel availability is checked separately.</p>`;
 if(page==='login'){
  document.querySelector('#code').addEventListener('input',e=>code=e.target.value);
  document.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();if(offline)return;if(code.length<4){document.querySelector('#login-error').textContent='Enter at least four digits for this design preview.';return;}go('manager');});
 }
 if(page==='manager')document.querySelector('#door-choice').addEventListener('change',e=>{door=Number(e.target.value);render();});
}
function confirmOpening(all){
 const targets=all?doors(tower):[door];const overlay=document.createElement('div');overlay.className='overlay';
 overlay.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><p class="eyebrow">TOWER ${tower}</p><h2 class="title" id="dialog-title">${all?'Open '+targets.length+' doors?':'Open door '+door+'?'}</h2><p>${all?'Every physical compartment in this tower will open. The controller cell is excluded.':'Make sure this compartment is clear to open.'}</p><div class="inline-actions">${btn('Cancel','cancel',true)}${btn(all?'Open tower':'Open door','confirm-open')}</div></section>`;
 kiosk.append(overlay);const cancel=overlay.querySelector('[data-action="cancel"]'),confirm=overlay.querySelector('[data-action="confirm-open"]');cancel.focus();
 cancel.onclick=()=>{overlay.remove();document.querySelector('[data-action="'+(all?'open-tower':'open-door')+'"]').focus();};
 confirm.onclick=()=>{targets.forEach(d=>opened.add(tower+':'+d));pending=true;overlay.remove();render();};
 overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){cancel.click();}if(e.key==='Tab'){e.preventDefault();(document.activeElement===cancel?confirm:cancel).focus();}});
}
document.addEventListener('click',e=>{
 const key=e.target.closest('[data-key]');if(key){code=document.querySelector('#code').value;code=key.dataset.key==='Clear'?'':key.dataset.key==='Delete'?code.slice(0,-1):(code+key.dataset.key).slice(0,12);document.querySelector('#code').value=code;return;}
 const t=e.target.closest('[data-tower]');if(t&&!t.disabled){tower=Number(t.dataset.tower);door=doors(tower)[0];render();return;}
 const d=e.target.closest('[data-door]');if(d&&!d.disabled){[tower,door]=d.dataset.door.split(',').map(Number);render();return;}
 const action=e.target.closest('[data-action]');if(!action||action.disabled)return;
 const a=action.dataset.action;if(['cancel','confirm-open'].includes(a))return;
 if(a==='open-door'||a==='open-tower'){confirmOpening(a==='open-tower');return;}
 if(a==='decline'){go(flow);return;}go(a);
});
document.querySelector('#screen').onchange=e=>{pending=false;opened.clear();go(e.target.value);};
document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');kiosk.style.setProperty('--w',w+'px');kiosk.style.setProperty('--h',h+'px');kiosk.classList.toggle('compact',Number(h)<600);};
document.querySelector('#offline').onchange=e=>{offline=e.target.checked;render();};
document.querySelector('#advance').onclick=()=>{if(page==='manager'){opened.clear();pending=false;render();return;}if(offline)return;if(['pickup','send','collection','delivery'].includes(page))go('door');else if(page==='door')go('confirm');else if(page==='confirm')go('success');else if(page==='recovery')go('login');};
render();
</script>
</body></html>
